[workspace]
members = [
    "apps/windows-host",
    "crates/core",
    "crates/host-windows",
    "crates/protocol",
    "crates/transport",
    "tools/pointer-sink",
]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mlo0352/nfidb"
authors = ["NFiDB contributors"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "macros", "ws"] }
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu"] }
fast_image_resize = { version = "6.1", features = ["rayon"] }
futures-util = "0.3"
hostname = "0.4"
local-ip-address = "0.6"
mdns-sd = "0.21"
mime_guess = "2.0"
nfidb-core = { path = "crates/core" }
nfidb-host-windows = { path = "crates/host-windows" }
nfidb-protocol = { path = "crates/protocol" }
nfidb-transport = { path = "crates/transport" }
openh264 = "0.9.8"
parking_lot = "0.12"
qrcode = "0.14"
rand = "0.10"
rfd = { version = "0.17.2", default-features = false }
rust-embed = "8.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
toml = "0.9"
tower-http = { version = "0.7", features = ["catch-panic", "cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
webrtc = "0.17.1"
windows-capture = "2.0.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
