name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ipad-web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate
        run: .\scripts\test.ps1
      - name: Build portable package
        run: .\scripts\build-release.ps1 -SkipTests
      - name: GUI startup smoke
        run: .\scripts\gui-smoke.ps1 -ArchivePath .\build\packages\NFiDB-windows-x64.zip
      - name: Upload GUI smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nfidb-gui-smoke-release
          if-no-files-found: warn
          path: build/gui-smoke
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            build/packages/NFiDB-windows-x64.zip
            build/packages/NFiDB-windows-x64.zip.sha256
